name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
      - name: Build AAB
        run: |
          yes "" | bubblewrap init --manifest="https://msalarahmadmarslan-cmd.github.io/General-knowledge-quiz-/manifest.json" --packageId="com.rabia.gkquiz"
          yes "" | bubblewrap build
          
